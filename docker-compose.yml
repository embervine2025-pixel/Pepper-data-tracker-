services:
  db:
    image: postgres:16-alpine
    container_name: pepper-db
    environment:
      POSTGRES_USER: pepper
      POSTGRES_PASSWORD: pepper
      POSTGRES_DB: pepper_dev
    ports:
      - '5432:5432'
    volumes:
      - pepper-db-data:/var/lib/postgresql/data
      # Creates the separate database the test suite truncates freely.
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pepper -d pepper_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pepper-db-data:
